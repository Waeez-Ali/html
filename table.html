<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
  </head>
  <body>
    <h2>Students</h2>

    <table border="1">
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
      </tr>

      <tr>
        <td>Ali</td>
        <td>22</td>
        <td>Karachi</td>
      </tr>

      <tr>
        <td>Muzammil</td>
        <td>16</td>
        <td>karachi</td>
      </tr>


      <tr>
        <td>Areej</td>
        <td>17</td>
        <td>karachi</td>
      </tr>
    </table>

  </body>
</html>


//table  → Complete table
//tr     → Table row
//th     → Table heading
//td     → Table data
