<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LIST</title>
  </head>
  <body>
    <h2>Unordered List</h2>

    <ul>
      <li>Apple</li>
      <li>Banana</li>
      <li>Mango</li>
    </ul>

    <h2>Ordered List</h2>

    <ol>
      <li>Wake up</li>
      <li>Have breakfast</li>
      <li>Go to university</li>
    </ol>

    //div aur span

    <div>
      <h2>Student Information</h2>
      <p>Name: Waeez</p>
      <p>Age: 20</p>
    </div>

    <p>My name is <span>Waeez</span>.</p>
    
  </body>
</html>
