<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
  </head>
  <body>

    <h2>Student Registration</h2>

    <form>
      <label>Name:</label>
      <input type="text" />

      <br /><br />

      <label>Email:</label>
      <input type="email" />

      <br /><br />

      <label>Password:</label>
      <input type="password" />

      <br /><br />

      <label>Message:</label>
      <textarea></textarea>

      <br /><br />

      <label>City:</label>

      <select>
        <option>Karachi</option>
        <option>Lahore</option>
        <option>Islamabad</option>
      </select>

      <br /><br />

      <button type="submit">Register</button>
    </form>


  </body>
</html>


//form       → Form ka container
//label      → Input ka naam
//input      → User se data lena
//textarea   → Long text lena
//select     → Dropdown
//option     → Dropdown ka option
//button     → Button
